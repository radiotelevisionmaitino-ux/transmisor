<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonizador Maitino</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { 
            background: #050508; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #status { 
            margin-bottom: 25px; 
            font-size: 1.1rem; 
            color: #888; 
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-play { 
            background: #00ffaa; 
            color: #000; 
            border: none; 
            padding: 18px 45px; 
            font-size: 1.2rem; 
            font-weight: 900; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
        }
        .btn-play:hover { 
            background: #00e699; 
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.6); 
            transform: scale(1.05);
        }
        .btn-play:disabled { 
            background: #333; 
            color: #666; 
            cursor: not-allowed; 
            box-shadow: none; 
            transform: none;
        }
        .on-air { 
            color: #ff1a1a !important; 
            font-weight: bold; 
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.8); 
        }
        audio { display: none; } /* Ocultamos el reproductor feo por defecto */
    </style>
</head>
<body>

    <div id="status">LISTO PARA CONECTAR</div>
    <button id="btn-connect" class="btn-play">SINTONIZAR RADIO</button>
    
    <!-- Reproductor nativo oculto -->
    <audio id="player" playsinline></audio>

<script>
    const player = document.getElementById('player');
    const statusText = document.getElementById('status');
    const btnConnect = document.getElementById('btn-connect');
    
    const HOST_PRIVADO = 'maitino-studio-host-v2';
    
    let peer;
    let audioCtx;
    let retryCount = 0;
    let isConnecting = false;
    let currentCall = null;
    let keepAliveInterval = null;

    // Requiere interacción humana para saltarse el bloqueo de autoplay
    btnConnect.addEventListener('click', iniciarSintonizador);

    async function iniciarSintonizador() {
        if (isConnecting) return;
        isConnecting = true;
        
        btnConnect.disabled = true;
        btnConnect.innerText = "CONECTANDO...";
        statusText.innerText = "Iniciando motor de audio...";

        // 1. Crear / reanudar contexto de audio validado por el usuario
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        conectarPeer();
    }

    function conectarPeer() {
        statusText.innerText = "Buscando servidor...";
        
        if (peer) {
            peer.destroy();
        }

        peer = new Peer({
            host: 'maitino-peer-server.onrender.com',
            port: 443,
            secure: true,
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (id) => {
            statusText.innerText = "Conectando al estudio...";
            
            // Creamos un stream vacío estrictamente necesario para que PeerJS inicie la llamada
            const dummyStream = audioCtx.createMediaStreamDestination().stream;
            
            // CLAVE: Enviamos el metadato 'role: listener' para que el transmisor nos trate como oyente
            currentCall = peer.call(HOST_PRIVADO, dummyStream, { metadata: { role: 'listener' } });

            currentCall.on('stream', (remoteStream) => {
                retryCount = 0; // Éxito: reseteamos el contador de reintentos
                statusText.innerText = "● EN DIRECTO";
                statusText.classList.add('on-air');
                btnConnect.innerText = "SINTONIZADO";
                
                player.srcObject = remoteStream;
                player.play().catch(e => console.error("Error al reproducir:", e));
            });

            currentCall.on('error', (err) => {
                console.warn("Llamada rechazada o fallida:", err);
                manejarDesconexion();
            });

            currentCall.on('close', () => {
                manejarDesconexion();
            });

            // Monitorizar el estado profundo del túnel P2P (Detecta si te quedas sin WiFi o 4G)
            currentCall.peerConnection.addEventListener('iceconnectionstatechange', () => {
                const state = currentCall.peerConnection.iceConnectionState;
                if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    console.warn("Corte de red detectado (ICE State: " + state + ")");
                    manejarDesconexion();
                }
            });
        });

        peer.on('error', (err) => {
            console.error("Error de conexión al servidor:", err);
            manejarDesconexion();
        });
        
        peer.on('disconnected', () => {
            // Si el servidor inactivo nos corta, nos reconectamos silenciosamente al servidor base
            if (!peer.destroyed) {
                peer.reconnect();
            }
        });

        // Ping para mantener la conexión viva con el servidor de Render y que no nos expulse
        clearInterval(keepAliveInterval);
        keepAliveInterval = setInterval(() => {
            if (peer && !peer.disconnected && !peer.destroyed) {
                peer.socket.send({ type: 'PING' });
            }
        }, 15000); 
    }

    function manejarDesconexion() {
        if (!isConnecting && player.paused) return; // Evitar bucles dobles
        
        isConnecting = false;
        statusText.classList.remove('on-air');
        statusText.innerText = "Señal perdida. Reconectando...";
        btnConnect.innerText = "RECONECTANDO...";
        btnConnect.disabled = true;
        
        player.pause();
        player.srcObject = null;
        
        if (currentCall) {
            currentCall.close();
            currentCall = null;
        }

        // Sistema de Reconexión Inteligente (Exponential Backoff)
        // Intentará a los 2s, 4s, 8s, 16s, hasta un tope de 30s por intento
        const retraso = Math.min(2000 * Math.pow(2, retryCount), 30000);
        retryCount++;
        
        console.log(`Reintentando conexión en ${retraso/1000} segundos... (Intento ${retryCount})`);
        
        setTimeout(() => {
            if (audioCtx && audioCtx.state === 'running') {
                conectarPeer();
            } else {
                // Si el navegador congeló la pestaña, pedimos pulsar de nuevo
                statusText.innerText = "Emisión detenida";
                btnConnect.innerText = "REANUDAR CONEXIÓN";
                btnConnect.disabled = false;
            }
        }, retraso);
    }
</script>
</body>
</html>
